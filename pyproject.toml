[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'etlonomy'
version = '0.1.0'
description = 'Dataset and dependency resolution for Python ETL workflows.'
readme = 'README.md'
requires-python = '>=3.11'
license = {text = 'MIT'}
authors = [{name = 'dcronkite'}]
dependencies = [
    'polars>=1.0',
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
sas = ['pyreadstat>=1.2']
keepass = ['pykeepass>=4.1']
dev = [
    'mypy>=1.10',
    'mkdocs>=1.6',
    'pytest>=8.0',
    'pytest-cov>=5.0',
    'ruff>=0.6',
]

[project.scripts]
etlonomy = 'etlonomy.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
etlonomy = ['catalog/migrations/*.sql']

[tool.pytest.ini_options]
addopts = '--strict-config --strict-markers --cov=etlonomy --cov-branch --cov-report=term-missing'
testpaths = ['tests']

[tool.coverage.run]
branch = true
source = ['etlonomy']

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ['src', 'tests']
target-version = 'py314'
exclude = ['.venv', 'site']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'C4', 'UP', 'D']
ignore = ['D203', 'D213', 'E501']

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = ['D']

[tool.mypy]
python_version = '3.14'
strict = true
packages = ['etlonomy']
mypy_path = 'src'
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ['pykeepass.*', 'pyreadstat.*']
ignore_missing_imports = true
